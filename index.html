<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 Isabelly Victória — Meu Cantinho de Estudos</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{
  --pink:#ff8fab;--pink2:#ffb3c6;--pink3:#ffd6e0;
  --lilac:#c77dff;--lilac2:#e0aaff;--lilac3:#f3e8ff;
  --mint:#80ed99;--mint2:#b7e4c7;--mint3:#d8f3dc;
  --yellow:#ffd166;--blue:#90e0ef;
  --bg:#fff9fb;--surface:#ffffff;--surface2:#fff0f5;
  --border:#ffd6e0;--text:#4a3050;--text2:#7b5e7b;--text3:#b08cb0;
  --radius:18px;--shadow:0 4px 24px #ff8fab22;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Quicksand',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* DECO */
.deco-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.deco-bg span{position:absolute;opacity:.11;animation:floatDeco linear infinite;}
@keyframes floatDeco{0%{transform:translateY(100vh) rotate(0);opacity:0}10%{opacity:.11}90%{opacity:.11}100%{transform:translateY(-120px) rotate(360deg);opacity:0}}

/* TOPBAR */
#topbar{position:sticky;top:0;z-index:100;background:rgba(255,249,251,.93);backdrop-filter:blur(12px);border-bottom:2px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;}
.top-logo{font-family:'Nunito',sans-serif;font-weight:900;font-size:19px;background:linear-gradient(135deg,var(--pink),var(--lilac));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;}
.spacer{flex:1;}
#top-clock{font-family:'Nunito',sans-serif;font-weight:800;font-size:14px;color:var(--pink);background:var(--pink3);padding:5px 13px;border-radius:20px;}
.sync-pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--mint3);color:#2d6a4f;}

/* LAYOUT - MODIFICADO: APP SEMPRE VISÍVEL */
#app{display:block;min-height:100vh;position:relative;z-index:1;}
#content{padding:18px 16px 96px;max-width:720px;margin:0 auto;}

/* PANELS */
.panel{display:none;animation:fadeUp .3s ease;}
.panel.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* CARDS */
.card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);}
.card-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px;}

/* BOTTOM NAV */
#bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(255,249,251,.96);backdrop-filter:blur(12px);border-top:2px solid var(--border);display:flex;justify-content:space-around;align-items:center;padding:6px 4px 10px;}
.bnav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;cursor:pointer;padding:5px 8px;border-radius:14px;transition:all .2s;color:var(--text3);font-family:'Quicksand',sans-serif;font-size:9px;font-weight:700;min-width:54px;}
.bnav-btn .ico{font-size:20px;}
.bnav-btn.active{background:var(--pink3);color:var(--pink);}
.bnav-btn.active .ico{transform:scale(1.15);}

/* DASHBOARD */
.welcome-banner{background:linear-gradient(135deg,#ffd6e0,#e0aaff,#b7e4c7);border-radius:var(--radius);padding:22px 18px;margin-bottom:18px;text-align:center;position:relative;overflow:hidden;}
.welcome-banner::before{content:'🌸✨🌸✨🌸';position:absolute;top:8px;left:0;right:0;font-size:14px;opacity:.35;letter-spacing:8px;}
.welcome-name{font-family:'Nunito',sans-serif;font-weight:900;font-size:22px;color:var(--text);margin-bottom:4px;}
.welcome-sub{font-size:13px;color:var(--text2);font-weight:600;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.stat-pill{background:var(--surface2);border:2px solid var(--border);border-radius:14px;padding:12px 8px;text-align:center;}
.stat-pill .val{font-family:'Nunito',sans-serif;font-weight:900;font-size:22px;background:linear-gradient(135deg,var(--pink),var(--lilac));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.stat-pill .lbl{font-size:10px;color:var(--text3);font-weight:700;margin-top:2px;}

/* CADERNO */
#editor-toolbar{display:flex;flex-wrap:wrap;gap:5px;padding:10px;background:var(--surface2);border:2px solid var(--border);border-radius:14px 14px 0 0;border-bottom:none;}
.t-btn{background:white;border:2px solid var(--border);border-radius:9px;padding:5px 9px;font-size:13px;cursor:pointer;font-family:'Quicksand',sans-serif;font-weight:700;color:var(--text);transition:all .15s;}
.t-btn:hover{border-color:var(--pink);color:var(--pink);}
#editor{min-height:300px;padding:18px;background:white;border:2px solid var(--border);border-radius:0 0 14px 14px;outline:none;font-size:15px;line-height:1.8;color:var(--text);font-family:'Quicksand',sans-serif;}
#editor:empty::before{content:attr(data-placeholder);color:var(--text3);pointer-events:none;}

/* FLASHCARDS */
.fc-wrap{perspective:1000px;height:190px;margin-bottom:14px;cursor:pointer;}
.fc-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);}
.fc-wrap.flipped .fc-inner{transform:rotateY(180deg);}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;padding:22px;text-align:center;font-size:17px;font-weight:700;border:2px solid var(--border);}
.fc-front{background:linear-gradient(135deg,#ffd6e0,#fff0f5);color:var(--text);}
.fc-back{background:linear-gradient(135deg,#e0aaff,#f3e8ff);color:var(--text);transform:rotateY(180deg);}

/* NOTAS */
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
.note-card{border-radius:14px;padding:14px;border:2px solid transparent;position:relative;font-size:13px;font-weight:600;line-height:1.6;min-height:120px;word-break:break-word;}
.note-card .note-del{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.1);border:none;border-radius:6px;width:22px;height:22px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;}
.note-card:hover .note-del{opacity:1;}
.note-card .note-tag{font-size:10px;font-weight:700;opacity:.6;margin-bottom:6px;}

/* ARQUIVOS */
.upload-zone{border:3px dashed var(--border);border-radius:var(--radius);padding:32px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:14px;background:var(--surface2);}
.upload-zone:hover,.upload-zone.drag{border-color:var(--pink);background:var(--pink3);}
.file-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:2px solid var(--border);background:var(--surface2);margin-bottom:8px;}
.file-icon{font-size:26px;flex-shrink:0;}
.file-info{flex:1;min-width:0;}
.file-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file-size{font-size:11px;color:var(--text3);margin-top:2px;}
.file-actions{display:flex;gap:6px;flex-shrink:0;}

/* PDF VIEWER */
#pdf-canvas{max-width:100%;border-radius:12px;border:2px solid var(--border);display:block;margin:0 auto;}
.viewer-nav{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:12px;flex-wrap:wrap;}

/* MAPA MENTAL */
#mindmap-canvas{border:2px solid var(--border);border-radius:var(--radius);background:white;cursor:crosshair;touch-action:none;}
.mm-controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}

/* AGENDA */
.ev-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:2px solid var(--border);background:var(--surface2);margin-bottom:8px;}
.ev-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.ev-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:15px;padding:4px;}
.ev-del:hover{color:var(--pink);}

/* POMODORO */
.pomo-ring{width:170px;height:170px;border-radius:50%;margin:14px auto;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px var(--pink3),0 0 0 10px var(--border);position:relative;transition:background .5s;}
.pomo-ring::before{content:'';position:absolute;inset:14px;background:white;border-radius:50%;}
.pomo-time-txt{font-family:'Nunito',sans-serif;font-weight:900;font-size:34px;color:var(--pink);position:relative;z-index:1;}

/* BUTTONS */
.btn{padding:10px 18px;border-radius:12px;border:none;cursor:pointer;font-family:'Quicksand',sans-serif;font-size:14px;font-weight:700;transition:all .15s;}
.btn-primary{background:linear-gradient(135deg,var(--pink),var(--lilac));color:white;box-shadow:0 4px 14px #ff8fab33;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px #ff8fab44;}
.btn-ghost{background:var(--surface2);border:2px solid var(--border);color:var(--text2);}
.btn-ghost:hover{border-color:var(--pink);color:var(--pink);}
.btn-mint{background:linear-gradient(135deg,var(--mint),#52b788);color:white;}
.btn-danger{background:#fff0f5;border:2px solid var(--pink2);color:var(--pink);}
.btn-sm{padding:6px 13px;font-size:12px;border-radius:10px;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

/* MODAL */
#modal-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(74,48,80,.35);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:16px;}
#modal-overlay.open{display:flex;}
.modal{background:white;border-radius:24px;padding:26px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px #ff8fab33;border:2px solid var(--border);animation:popIn .25s ease;}
.modal-title{font-family:'Nunito',sans-serif;font-weight:900;font-size:17px;color:var(--text);margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;}
.modal-close{background:var(--surface2);border:2px solid var(--border);border-radius:10px;width:30px;height:30px;cursor:pointer;font-size:13px;color:var(--text3);}
.modal-close:hover{border-color:var(--pink);color:var(--pink);}

#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--text);color:white;padding:9px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
#toast.show{opacity:1;}

::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--surface2);border-radius:3px;}
::-webkit-scrollbar-thumb{background:var(--pink2);border-radius:3px;}
</style>
</head>
<body>

<div class="deco-bg" id="deco-bg"></div>

<div id="app">
  <div id="topbar">
    <div class="top-logo">🌸 Isabelly Victória</div>
    <div class="spacer"></div>
    <div id="top-clock">00:00</div>
    <span class="sync-pill" id="sync-pill">✓ pronto</span>
  </div>

  <div id="content">

    <div class="panel active" id="p-dashboard">
      <div class="welcome-banner">
        <div class="welcome-name">Olá, Isabelly Victória! 🌸</div>
        <div class="welcome-sub" id="welcome-sub">Seja bem-vinda ao seu cantinho de estudos! ✨</div>
      </div>
      <div class="stats-row">
        <div class="stat-pill"><div class="val" id="s-cards">0</div><div class="lbl">🃏 Cards</div></div>
        <div class="stat-pill"><div class="val" id="s-notas">0</div><div class="lbl">🗒️ Notas</div></div>
        <div class="stat-pill"><div class="val" id="s-arquivos">0</div><div class="lbl">📁 Arquivos</div></div>
        <div class="stat-pill"><div class="val" id="s-eventos">0</div><div class="lbl">📅 Eventos</div></div>
      </div>
      <div class="card">
        <div class="card-title">📅 Próximos eventos</div>
        <div id="dash-events"><div class="empty"><div class="em">📭</div>Nenhum evento ainda!</div></div>
      </div>
    </div>

    </div><nav id="bottom-nav">
    <button class="bnav-btn active" onclick="nav('dashboard')"><span class="ico">🏠</span>Início</button>
    <button class="bnav-btn" onclick="nav('caderno')"><span class="ico">📝</span>Caderno</button>
    <button class="bnav-btn" onclick="nav('flash')"><span class="ico">🃏</span>Cards</button>
    <button class="bnav-btn" onclick="nav('notas')"><span class="ico">🗒️</span>Notas</button>
    <button class="bnav-btn" onclick="nav('arquivos')"><span class="ico">📁</span>Arquivos</button>
    <button class="bnav-btn" onclick="nav('mapa')"><span class="ico">🗺️</span>Mapa</button>
    <button class="bnav-btn" onclick="nav('agenda')"><span class="ico">📅</span>Agenda</button>
    <button class="bnav-btn" onclick="nav('timer')"><span class="ico">🍅</span>Timer</button>
  </nav>
</div>

<script>
// SCRIPT DE INICIALIZAÇÃO SIMPLIFICADO SEM LOGIN
window.onload = function() {
  updateClock();
  setInterval(updateClock, 1000);
  // Inicia o app diretamente
  document.getElementById('app').style.display = 'block';
  toast("✨ Bem-vinda!");
};

function updateClock(){
  const now = new Date();
  document.getElementById('top-clock').textContent = now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
}

function nav(p){
  document.querySelectorAll('.panel').forEach(el=>el.classList.remove('active'));
  document.getElementById('p-'+p).classList.add('active');
  document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.remove('active'));
  event.currentTarget.classList.add('active');
}

function toast(m){
  const t=document.getElementById('toast');
  t.textContent=m; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

// ADICIONE AQUI AS FUNÇÕES ORIGINAIS DE CADA MÓDULO (CADERNO, NOTAS, ETC.)
</script>

</body>
</html>
